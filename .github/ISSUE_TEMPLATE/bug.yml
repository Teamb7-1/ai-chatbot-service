name: 버그 신고
description: 동작하지 않는 것을 등록한다
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇이 어떻게 잘못되는가. 오류 메시지가 있으면 그대로 붙인다
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 발생 환경
      options:
        - "로컬 (uvicorn)"
        - "배포 (Vercel)"
        - "둘 다"
        - "CI (GitHub Actions)"
    validations:
      required: true

  - type: input
    id: rid
    attributes:
      label: request_id
      description: 챗봇 요청 관련이면 /logs 화면이나 응답에서 확인해 적는다
