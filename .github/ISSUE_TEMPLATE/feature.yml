name: 기능 작업
description: 구현할 기능 하나를 등록한다
title: "[기능] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        작업은 이슈로 등록하고 브랜치·PR에 이슈 번호를 연결한다.
        브랜치 이름: `feature/{이슈번호}-{설명}` (예: `feature/7-chat-api`)

  - type: textarea
    id: what
    attributes:
      label: 작업 내용
      description: 무엇을 만드는가
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: 담당
      options:
        - "A — 인증 · 리포"
        - "B — 챗봇 · AI"
        - "C — DB · 로그"
        - "D — 인프라 · 화면 · 앱 골격"
    validations:
      required: true

  - type: input
    id: criteria
    attributes:
      label: 관련 평가항목
      description: 계획서 12장 매핑표의 번호. 없으면 "없음"
      placeholder: "10, 16"
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 끝인가. 체크박스로
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: 선행 조건
      description: 다른 사람의 어떤 작업이 먼저 끝나야 하는가. 없으면 비워둔다
