name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # --- 실험 관찰 ---
      # Vercel은 git 작업 디렉터리에서 배포하면 커밋 author 이메일을 함께 보내고,
      # 그 이메일이 계정에 접근 권한이 없으면 "git author must have access"로 거부한다.
      # 1차 실행은 가드 없이 돌려 실제로 거부되는지 확인한다.
      # 거부되면 이 아래에 git config 2줄(VERCEL_ACCOUNT_EMAIL)을 추가한다.
      - name: 머지 커밋 author 확인
        run: |
          git log -1 --format='author    = %an <%ae>'
          git log -1 --format='committer = %cn <%ce>'
          git log -1 --format='subject   = %s'

      - name: Vercel CLI 설치
        run: npm i -g vercel@latest

      # Vercel의 Python 빌더는 Vercel 밖에서 `vercel build`를 돌릴 때
      # uv를 PATH에서 찾는다. 러너에는 기본 설치되어 있지 않다.
      # 설치 스크립트를 파이프로 실행하지 않고 공식 액션을 버전 고정해 쓴다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.26"

      - name: uv 확인
        run: uv --version

      - name: 환경 pull
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 배포
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 헬스체크 (프로덕션 별칭)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://b7-ai-chatbot.vercel.app/healthz)
            echo "시도 $i — /healthz -> $code"
            if [ "$code" = "200" ]; then
              echo "배포 확인 완료: https://b7-ai-chatbot.vercel.app"
              exit 0
            fi
            sleep 5
          done
          echo "::error::헬스체크가 200을 반환하지 않았다"
          exit 1
