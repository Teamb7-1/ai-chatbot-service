name: ci

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # database.py(#70)가 import 시점에 DATABASE_URL 을 요구한다. 스모크의 `import app.main` 이
    # 그 파일에 닿는 순간 죽으므로 더미를 준다. create_engine 은 첫 connect 까지 연결하지 않는다.
    # 비밀이 아니다 — 연결되지 않는 주소다.
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: 린트
        run: ruff check .

      # 승인 게이트가 없으므로 이 스모크가 유일한 방어선이다.
      # import 에러가 난 코드가 main에 자동 머지되어 배포까지 나가는 사고를 막는다.
      - name: 스모크 — 앱 import + /healthz 200
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          res = TestClient(app).get("/healthz")
          assert res.status_code == 200, f"status={res.status_code}"
          assert res.json() == {"status": "ok"}, f"body={res.json()}"
          print("smoke OK — 앱이 기동하고 /healthz 가 200을 반환한다")
          PY

      # 원래 9/14에 required 로 승격할 계획이었으나 tests/ 가 생긴 시점에 앞당긴다.
      # continue-on-error 로 두면 테스트가 통째로 깨져도 초록불이 떠서 머지된다
      # (실제로 ModuleNotFoundError 를 그렇게 놓쳤다).
      - name: 테스트
        run: pytest -q
